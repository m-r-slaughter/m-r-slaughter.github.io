<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{ page.title }}</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/images/favicon-192.png">
    <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
    <link rel="stylesheet" href="/assets/css/normalize.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Nosifer&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="/assets/css/responsive.css">
    <script defer src="https://use.fontawesome.com/releases/v5.8.1/js/all.js" integrity="sha384-g5uSoOSBd7KkhAMlnQILrecXvzst9TdC09/VM+pjDTCM+1il8RHz5fKANTFFb+gQ" crossorigin="anonymous"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    {% if page.dir != "/" %}
    <header>
        <a href="/" id="logo">
            <h1 class="logo"><span class="logo-initials">M &middot; R</span> <span class="logo-surname">Slaughter</span></h1>
        </a>
        {% if page.dir != "/slaughter-house/" %}
        <nav>
            <ul>
                <li><a href="/slaughter-house/"{% if page.dir == "/slaughter-house/" %} class="is-current"{% endif %}>Slaughter House</a></li>
                <li><a href="/poe-log/"{% if page.dir == "/poe-log/" %} class="is-current"{% endif %}>Poe-log</a></li>
                <li><a href="/slashing-stories/"{% if page.dir contains "/slashing-stories/" %} class="is-current"{% endif %}>Slashing Stories</a></li>
                <li><a href="/about/"{% if page.dir == "/about/" %} class="is-current"{% endif %}>About</a></li>
            </ul>
        </nav>
        {% endif %}
    </header>
    {% endif %}
    <div id="wrapper">
        {{ content }}
        <footer>
            <p>&copy; <span class="date"></span> M R Slaughter</p>
        </footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/typeit@6.0.2/dist/typeit.min.js"></script>
    <script type="text/javascript" src="/assets/js/site.js"></script>
</body>
</html>
